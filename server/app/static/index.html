<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>DeskLess · Dashboard</title>
<link rel="stylesheet" href="static/app.css">
</head>
<body>

<section id="signin" hidden>
  <div class="signin-card card">
    <a class="brandmark" href="./" title="What DeskLess is">
      <div class="mark">DL</div>
      <div><strong>DeskLess</strong><span>Inspection reports, without the desk</span></div>
    </a>
    <div class="stripes"></div>
    <div id="signin-own">
      <h2>Sign in</h2>
      <p class="hint">Use the DeskLess ID you got when your account was approved, and the password you chose when you signed up.</p>
      <form id="signin-form">
        <label for="id">DeskLess ID</label>
        <input id="id" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="DL-MGR-0001" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <div class="error" id="signin-error"></div>
        <button class="primary wide">Sign in</button>
      </form>
      <button type="button" id="forgot-open" class="quiet wide">Forgot password?</button>
      <p class="hint small">No account yet? <a href="signup">Sign up here</a> or in the DeskLess app.<br>The administrator signs in with their email address.</p>
    </div>
    <div id="forgot" hidden></div>
  </div>
</section>

<div id="shell" hidden>
  <aside id="side">
    <div class="brandmark">
      <div class="mark">DL</div>
      <div><strong>DeskLess</strong><span id="company"></span></div>
    </div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="me">
      <div class="who"><strong id="who-name"></strong><span id="who-role"></span></div>
      <button id="signout" class="quiet">Sign out</button>
    </div>
  </aside>

  <div id="main">
    <div class="stripes"></div>
    <header id="top">
      <div class="grow">
        <h2 id="page-title"></h2>
        <p id="page-sub"></p>
      </div>
      <div id="live" class="live" hidden><i></i><span id="live-text">Live</span></div>
      <button id="again" class="small" hidden>Refresh</button>
    </header>
    <main><section id="view"></section></main>
  </div>
</div>

<dialog id="sheet"></dialog>
<dialog id="big"><img alt="Picture"></dialog>
<div id="note" role="status" hidden></div>

<script src="static/app.js"></script>
</body>
</html>
