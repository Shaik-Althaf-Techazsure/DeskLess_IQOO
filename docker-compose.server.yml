# DeskLess on a real server: the API the app talks to and the dashboards, with their database.
# Nothing else from this repository runs there: no APK build, no web prototype, no test mailbox.
#
#   sudo bash deploy/setup.sh        the first time: settings, this file, and the site's nginx
#   sudo sh deploy/update.sh         after each push to GitHub
#   sudo bash deploy/setup.sh ai     adds the open-source model that words the assistant's summaries
#
# By hand:  cp .env.example .env , fill in the server's part of it, then
#   docker compose -f docker-compose.server.yml up -d --build
#
# The server listens on this machine only (127.0.0.1:8800). The site's own web server adds HTTPS and
# passes the path in PUBLIC_URL on to it; deploy/nginx.conf has the lines for that.
name: deskless

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deskless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deskless}
      POSTGRES_DB: ${POSTGRES_DB:-deskless}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-deskless}:${POSTGRES_PASSWORD:-deskless}@db:5432/${POSTGRES_DB:-deskless}
      DATA_DIR: /data
      # Where people reach the server, path included, e.g. https://www.shaikalthaf.in/competitions/iqoo
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env to the address people reach the server at}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      # On a real server these three are set, and kept: a lost SECRET_KEY signs everyone out, and a lost
      # AADHAAR_KEY makes the stored Aadhaar numbers unreadable for good.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      AADHAAR_KEY: ${AADHAAR_KEY:?Set AADHAAR_KEY in .env}
      # A real mail server. Left empty, no email leaves the machine and each one is written to the
      # server's log instead, which is enough for a first check and nothing more.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      MAIL_FROM: ${MAIL_FROM:-DeskLess <no-reply@deskless.local>}
      UTC_OFFSET_MINUTES: ${UTC_OFFSET_MINUTES:-330}
      # The writing model below, when it runs. With nothing answering there, the assistant words its
      # summaries itself from each issue's own fields.
      AI_URL: ${AI_URL:-http://ai:8080}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-}
      # The assistant's own rounds: how often it looks (0 leaves them out) and how long it lets things wait.
      AUTOPILOT_EVERY_SECONDS: ${AUTOPILOT_EVERY_SECONDS:-60}
      AUTOPILOT_UNTAKEN_MINUTES: ${AUTOPILOT_UNTAKEN_MINUTES:-30}
      AUTOPILOT_ESCALATE_MINUTES: ${AUTOPILOT_ESCALATE_MINUTES:-120}
      AUTOPILOT_UNCHECKED_HOURS: ${AUTOPILOT_UNCHECKED_HOURS:-24}
    ports:
      # Only this machine can reach it; the site's web server stands in front.
      - "${SERVER_BIND:-127.0.0.1}:${SERVER_PORT:-8800}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so AI_URL can name a model served on this machine itself
    volumes:
      - accounts:/data               # profile photos, reports, issue pictures
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # The writing model: an open-source language model (Gemma 3, 1B) run on this machine by llama.cpp.
  # It words the assistant's summaries on the dashboards. Nothing is sent to anyone else's service, and
  # only the server can reach it. It is off unless asked for, because it wants about 1 GB of memory:
  #   sudo bash deploy/setup.sh ai      (checks the free memory first), or by hand:
  #   COMPOSE_PROFILES=ai in .env, then  sudo sh deploy/update.sh
  # The first start downloads the model (about 800 MB) into the "ai_models" volume. Without it, or
  # while it loads, the assistant words its summaries from each issue's own fields.
  ai:
    profiles: ["ai"]
    image: ghcr.io/ggml-org/llama.cpp:server
    environment:
      LLAMA_ARG_HF_REPO: ${AI_MODEL:-ggml-org/gemma-3-1b-it-GGUF}
      LLAMA_ARG_ALIAS: ${AI_MODEL_NAME:-gemma-3-1b-it}
      LLAMA_ARG_CTX_SIZE: 4096
      LLAMA_ARG_N_PARALLEL: 1
      # Few threads on purpose: a summary may take a little longer, and whatever else runs here keeps its share.
      LLAMA_ARG_THREADS: ${AI_THREADS:-2}
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080
      LLAMA_ARG_UI: "false"
    mem_limit: ${AI_MEMORY:-2g}
    volumes:
      - ai_models:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 80
      start_period: 30s
    restart: unless-stopped

volumes:
  db_data:
  accounts:
  ai_models:
