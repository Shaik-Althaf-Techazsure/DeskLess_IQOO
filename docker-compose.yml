# DeskLess: one command builds the Android app, starts the server it signs in and sends reports to,
# and starts the web prototype (database, API with local speech-to-text, web app).
#
#   docker compose up --build                   everything
#   docker compose up --build db server mail    only the server with its dashboards, its database and the test mailbox
#   docker compose up --build app               only the Android APK + install page
#   docker compose --profile ai up --build      adds the local open-source models: the one that words the
#                                               server's assistant, and Ollama for the web prototype
#
# On a real server only the server and its database run: see docker-compose.server.yml.
name: deskless

services:
  # The Android app: compiled in a container, then served with an install page.
  app:
    build:
      context: ./android
      args:
        # The server the built app signs in and sends reports to, e.g. https://deskless.example.com
        SERVER_URL: ${APP_SERVER_URL:-${PUBLIC_URL:-}}
    ports:
      - "${APP_PORT:-8700}:80"       # http://localhost:8700, or http://<this machine's IP>:8700 from a phone
    volumes:
      - ./apk:/out                   # the built APK is also copied here
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deskless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deskless}
      POSTGRES_DB: ${POSTGRES_DB:-deskless}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The server behind the Android app: accounts for five roles (sign-up with a code sent by email,
  # approval by the level above, sign-in with a unique ID), the reports the phones send, and a dashboard
  # for each role. Everyone signs in at http://localhost:8800.
  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-deskless}:${POSTGRES_PASSWORD:-deskless}@db:5432/${POSTGRES_DB:-deskless}
      DATA_DIR: /data
      # Where people reach the server from outside, path included; empty on a developer's machine.
      PUBLIC_URL: ${PUBLIC_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@deskless.local}
      # Left empty, these three are made on first start and kept in the "accounts" volume. The admin
      # password is then read with:  docker compose exec server sh -c "cat /data/admin-password.txt"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-}
      AADHAAR_KEY: ${AADHAAR_KEY:-}
      # The test mailbox below unless a real mail server is named in .env.
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-none}
      MAIL_FROM: ${MAIL_FROM:-DeskLess <no-reply@deskless.local>}
      # The writing model below, when it runs. With nothing answering there, the assistant words its
      # summaries itself from each issue's own fields.
      AI_URL: ${AI_URL:-http://ai:8080}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-}
      # The assistant's own rounds: how often it looks (0 leaves them out) and how long it lets things wait.
      AUTOPILOT_EVERY_SECONDS: ${AUTOPILOT_EVERY_SECONDS:-60}
      AUTOPILOT_UNTAKEN_MINUTES: ${AUTOPILOT_UNTAKEN_MINUTES:-30}
      AUTOPILOT_ESCALATE_MINUTES: ${AUTOPILOT_ESCALATE_MINUTES:-120}
      AUTOPILOT_UNCHECKED_HOURS: ${AUTOPILOT_UNCHECKED_HOURS:-24}
    ports:
      - "${SERVER_PORT:-8800}:8000"  # http://localhost:8800, or http://<this machine's IP>:8800 from a phone
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so AI_URL can name a model served on this machine itself
    volumes:
      - accounts:/data               # profile photos, reports, issue pictures and the generated keys
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # The writing model: an open-source language model (Gemma 3, 1B) run on this machine by llama.cpp.
  # It words the assistant's summaries on the dashboards. Nothing is sent to anyone else's service, and
  # only the server can reach it. It is off unless asked for, because it wants about 1 GB of memory:
  #   docker compose --profile ai up --build      or COMPOSE_PROFILES=ai in .env
  # The first start downloads the model (about 800 MB) into the "ai_models" volume. Without it, or
  # while it loads, the assistant words its summaries from each issue's own fields.
  ai:
    profiles: ["ai"]
    image: ghcr.io/ggml-org/llama.cpp:server
    environment:
      LLAMA_ARG_HF_REPO: ${AI_MODEL:-ggml-org/gemma-3-1b-it-GGUF}
      LLAMA_ARG_ALIAS: ${AI_MODEL_NAME:-gemma-3-1b-it}
      LLAMA_ARG_CTX_SIZE: 4096
      LLAMA_ARG_N_PARALLEL: 1
      # Few threads on purpose: a summary may take a little longer, and whatever else runs here keeps its share.
      LLAMA_ARG_THREADS: ${AI_THREADS:-2}
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080
      LLAMA_ARG_UI: "false"
    mem_limit: ${AI_MEMORY:-2g}
    volumes:
      - ai_models:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 80
      start_period: 30s
    restart: unless-stopped

  # A test mailbox. It catches every email the server sends (sign-up codes, approvals, work given out) and shows
  # them at http://localhost:8825. Only this machine can open it. Nothing is sent to the real addresses.
  mail:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAIL_PORT:-8825}:8025"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-deskless}:${POSTGRES_PASSWORD:-deskless}@db:5432/${POSTGRES_DB:-deskless}
      MEDIA_DIR: /data/media
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      # Reachable only when the "ai" profile is running; otherwise the app falls back to built-in rules.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-gemma3:4b}
    volumes:
      - media:/data/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8600}:80"       # http://localhost:8600 on this machine
      - "${WEB_TLS_PORT:-8643}:443"  # https://<this machine's IP>:8643 from a phone
    volumes:
      - caddy_data:/data
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  # Downloads the model once, then exits.
  ollama-pull:
    profiles: ["ai"]
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull ${LLM_MODEL:-gemma3:4b}"]
    restart: "no"

volumes:
  db_data:
  accounts:
  media:
  caddy_data:
  ollama:
  ai_models:
