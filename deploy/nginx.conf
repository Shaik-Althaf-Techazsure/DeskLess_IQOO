# DeskLess under  https://shaikalthaf.in/competitions/IQOO/
#
# Put this block inside the site's existing  server { ... }  for port 443, above the  location /  that
# hands everything else to the site itself. Then check and reload:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# The path here must be the one in PUBLIC_URL (.env). Capitals do not matter:
# /competitions/iqoo/dashboard opens the same page.

location ~* ^/competitions/iqoo(/|$) {
    # The server from docker-compose.server.yml, which listens on this machine only.
    proxy_pass http://127.0.0.1:8800;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A report arrives as one upload: the PDF and a picture for every issue.
    client_max_body_size 64m;
    proxy_read_timeout   120s;
}
