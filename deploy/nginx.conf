# DeskLess under  https://www.shaikalthaf.in/competitions/iqoo/
#
# deploy/setup.sh puts these lines into nginx by itself, with the path and port from .env.
# By hand: put this block inside the site's existing  server { ... }  for port 443, as its first
# location, so that no other rule of the site (one for .js files, say) comes before it. Then:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# The path here must be the one in PUBLIC_URL (.env). Capitals do not matter:
# /competitions/IQOO/dashboard opens the same page.

location ~* ^/competitions/iqoo(/|$) {
    # The server from docker-compose.server.yml, which listens on this machine only.
    proxy_pass http://127.0.0.1:8800;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A report arrives as one upload: the PDF and a picture for every issue.
    client_max_body_size 64m;
    proxy_read_timeout   120s;
}
